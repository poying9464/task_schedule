# Task Schedule Configuration

# Quartz Configuration
quartz:
  # Scheduler configuration
  scheduler:
    instanceName: MyQuartzScheduler
    instanceId: AUTO
  
  # Thread pool configuration
  threadPool:
    class: org.quartz.simpl.SimpleThreadPool
    threadCount: 5
    threadPriority: 5
  
  # Job store configuration - JDBC storage
  jobStore:
    class: org.quartz.impl.jdbcjobstore.JobStoreTX
    driverDelegateClass: org.quartz.impl.jdbcjobstore.StdJDBCDelegate
    tablePrefix: QRTZ_
    isClustered: false
    useProperties: false
    dataSource: myDS
  
  # Data source configuration
  dataSource:
    myDS:
      driver: com.mysql.cj.jdbc.Driver
      URL: jdbc:mysql://192.168.4.128:3306/task_schedule?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
      user: root
      password: luoqiu9464
      maxConnections: 10
      validationQuery: select 1

# Task configuration
tasks:
  - name: sampleJob
    className: org.poying.jobs.SampleJob
    trigger:
      name: sampleJobTrigger
      type: simple
      intervalInSeconds: 10
      repeatForever: true
  
  - name: fiveMinuteJob
    className: org.poying.jobs.FiveMinuteJob
    trigger:
      name: fiveMinuteJobTrigger
      type: cron
      cronExpression: 0 0/5 * * * ?
      
  - name: testJob
    className: org.poying.jobs.TestJob
    trigger:
      name: testJobTrigger
      type: simple
      intervalInSeconds: 30
      repeatForever: true