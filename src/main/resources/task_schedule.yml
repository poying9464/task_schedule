# Task Schedule Configuration

# Quartz Configuration
quartz:
  # Scheduler configuration
  scheduler:
    instanceName: MyQuartzScheduler
    instanceId: AUTO
  
  # Thread pool configuration
  threadPool:
    clazz: org.quartz.simpl.SimpleThreadPool
    threadCount: 5
    threadPriority: 5
  
  # Job store configuration - JDBC storage
  jobStore:
    clazz: org.quartz.impl.jdbcjobstore.JobStoreTX
    driverDelegateClass: org.quartz.impl.jdbcjobstore.StdJDBCDelegate
    tablePrefix: QRTZ_
    clustered: false
    useProperties: false
    dataSource: myDS
  
  # Data source configuration
  dataSource:
    myDS:
      driver: com.mysql.cj.jdbc.Driver
      URL: jdbc:mysql://192.168.4.128:3306/task_schedule?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
      user: root
      password: luoqiu9464
      maxConnections: 10
      validationQuery: select 1
